cd ~/TVRecoveryPro

mkdir -p .github/workflows

cat > .github/workflows/android.yml <<'EOF'
name: Build TV Recovery Pro APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "TVRecoveryPro_RECOVERY_ALL_IN_ONE/gradlew" ]; then
            echo "dir=TVRecoveryPro_RECOVERY_ALL_IN_ONE" >> "$GITHUB_OUTPUT"
          elif [ -f "gradlew" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "android/gradlew" ]; then
            echo "dir=android" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: Gradle wrapper not found."
            echo "Files and Gradle configurations found:"
            find . -maxdepth 5 -type f \( \
              -name gradlew -o \
              -name settings.gradle -o \
              -name settings.gradle.kts -o \
              -name build.gradle -o \
              -name build.gradle.kts \
            \)
            exit 1
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          PROJECT="${{ steps.project.outputs.dir }}"
          echo "Android project directory: $PROJECT"

          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRecoveryPro-APK
          path: |
            TVRecoveryPro_RECOVERY_ALL_IN_ONE/app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
EOF

echo "Workflow file created:"
cat .github/workflows/android.ym
