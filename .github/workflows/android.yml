name: Build TV Recovery Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          elif [ -f ./android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found"
            find . -maxdepth 4 -type f \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRecoveryPro-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
