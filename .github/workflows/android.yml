name: Build TV Recovery Pro APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          if [ -f "TVRecoveryPro_RECOVERY_ALL_IN_ONE/gradlew" ]; then
            echo "dir=TVRecoveryPro_RECOVERY_ALL_IN_ONE" >> "$GITHUB_OUTPUT"
          else
            echo "Gradle wrapper not found"
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRecoveryPro-APK
          path: TVRecoveryPro_RECOVERY_ALL_IN_ONE/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
